<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Математический график</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: #0f172a;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      position: relative;
    }

    /* Холст с графиком */
    canvas {
      background: #1e293b;
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      transform-origin: center center;
    }

    /* Анимация пульсации после завершения рисования */
    .pulsing {
      animation: heartbeat 1.25s infinite ease-in-out;
    }

    @keyframes heartbeat {
      0%   { transform: scale(1); }
      14%  { transform: scale(1.08); filter: drop-shadow(0 0 18px rgba(244, 63, 94, 0.6)); }
      28%  { transform: scale(1); }
      42%  { transform: scale(1.05); filter: drop-shadow(0 0 12px rgba(244, 63, 94, 0.4)); }
      70%  { transform: scale(1); filter: drop-shadow(0 0 0 rgba(0,0,0,0)); }
    }

    /* Кнопка запуска */
    button {
      padding: 14px 32px;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #e11d48, #f43f5e);
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(244, 63, 94, 0.4);
      transition: all 0.25s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(244, 63, 94, 0.5);
    }

    button:disabled {
      opacity: 0;
      pointer-events: none;
      transform: scale(0.9);
    }
  </style>
</head>
<body>

  <div class="container">
    <canvas id="plot" width="400" height="400"></canvas>
    <button id="startBtn">Построить функцию</button>
  </div>

  <script>
    const canvas = document.getElementById('plot');
    const ctx = canvas.getContext('2d');
    const btn = document.getElementById('startBtn');

    const width = canvas.width;
    const height = canvas.height;
    const centerX = width / 2;
    const centerY = height / 2 - 10;
    const scale = 9; // Масштаб отображения

    // Параметрические уравнения сердца
    function getHeartPoint(t) {
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
      return {
        // В canvas ось Y направлена вниз, поэтому инвертируем знак
        px: centerX + x * scale,
        py: centerY - y * scale
      };
    }

    // Отрисовка координатной сетки и осей
    function drawGrid() {
      ctx.clearRect(0, 0, width, height);

      // Сетка
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 1;
      const step = 25;

      for (let x = 0; x <= width; x += step) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, height);
        ctx.stroke();
      }
      for (let y = 0; y <= height; y += step) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }

      // Главные оси X и Y
      ctx.strokeStyle = '#64748b';
      ctx.lineWidth = 2;

      ctx.beginPath();
      ctx.moveTo(0, centerY);
      ctx.lineTo(width, centerY);
      ctx.moveTo(centerX, 0);
      ctx.lineTo(centerX, height);
      ctx.stroke();
    }

    drawGrid();

    // Анимированное построение линии
    btn.addEventListener('click', () => {
      btn.disabled = true; // Скрываем кнопку

      let t = 0;
      const tMax = Math.PI * 2;
      const step = 0.04;

      const firstPoint = getHeartPoint(0);
      let lastX = firstPoint.px;
      let lastY = firstPoint.py;

      ctx.strokeStyle = '#fb7185';
      ctx.lineWidth = 3.5;
      ctx.shadowColor = '#f43f5e';
      ctx.shadowBlur = 10;
      ctx.lineCap = 'round';

      function animate() {
        t += step;
        const pt = getHeartPoint(t);

        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(pt.px, pt.py);
        ctx.stroke();

        lastX = pt.px;
        lastY = pt.py;

        if (t <= tMax + step) {
          requestAnimationFrame(animate);
        } else {
          // Завершаем контур и запускаем пульсацию
          canvas.classList.add('pulsing');
        }
      }

      animate();
    });
  </script>
</body>
</html>
